<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>David Maxwell — Under Construction</title>
  <meta name="description" content="David Maxwell — new site coming soon.">
  <link rel="icon" href="dmlogowhite.gif">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0b0c;
      --fg: #f4f4f2;
      --muted: rgba(244, 244, 242, 0.55);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: "Space Grotesk", system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100svh;
      padding: 24px 16px;
      text-align: center;
      overflow: hidden;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 45%, rgba(255,255,255,0.06), transparent 60%);
      pointer-events: none;
    }
    .logo {
      width: min(400px, 78vw);
      height: auto;
      display: block;
      animation: fadeIn 1.2s ease-out both;
    }
    .status {
      margin-top: clamp(24px, 5vh, 48px);
      font-size: clamp(0.8rem, 2.4vw, 1rem);
      font-weight: 500;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      padding-left: 0.4em; /* balance trailing letter-spacing */
      animation: fadeIn 1.2s ease-out 0.4s both;
    }
    .status::after {
      content: "";
      display: block;
      width: 40px;
      height: 1px;
      margin: 18px auto 0;
      background: var(--muted);
      animation: pulse 2.4s ease-in-out infinite;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: none; }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.3; width: 40px; }
      50%      { opacity: 1;   width: 80px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .logo, .status, .status::after { animation: none; }
    }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="dmlogowhite.gif" alt="David Maxwell" width="400" height="400">
    <p class="status">Under Construction</p>
  </main>
</body>
</html>
